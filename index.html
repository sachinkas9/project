<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Assessment - Invoice Management</title>
        <link rel="stylesheet" href="style.css">
    </head>
    
<body>

    <div class="container">
        <h1 class="title">Assessment</h1>
        <h2>Invoice Management</h2>

        <form id="invoiceForm" autocomplete="off">
            <label for="invoiceNumber">Invoice Number</label>
            <input type="text" id="invoiceNumber" required>

            <label for="clientName">Client Name</label>
            <input type="text" id="clientName" required>

            <label for="amount">Amount ($)</label>
            <input type="number" id="amount" required>

            <label for="dueDate">Due Date</label>
            <input type="date" id="dueDate" required>

            <label for="status">Status</label>
            <select id="status">
                <option value="Pending">Pending</option>
                <option value="Paid">Paid</option>
            </select>

            <div class="form-actions">

                <input type="submit" id="submitButton" value="Add Invoice">
                <input type="reset" value="Clear" onclick="resetForm()">
            </div>
        </form>

        <table class="list" id="invoiceList">
            <thead>
                <tr>
                    <th>Invoice Number</th>
                    <th>Client Name</th>
                    <th>Amount</th>
                    <th>Due Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
